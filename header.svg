<svg fill="none" viewBox="0 0 850 200" width="850" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003B8E" />
      <stop offset="50%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>
    <style>
      .wave1 { animation: waveMove1 7s ease-in-out infinite alternate; }
      .wave2 { animation: waveMove2 5s ease-in-out infinite alternate; }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #ffffff;
        letter-spacing: 3px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 18px;
        fill: #E0F2FE;
        letter-spacing: 1px;
      }
      @keyframes waveMove1 {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-40px); }
      }
      @keyframes waveMove2 {
        0% { transform: translateX(-30px); }
        100% { transform: translateX(15px); }
      }
    </style>
  </defs>

  <!-- Fondo con bordes redondeados estilo iOS -->
  <rect width="850" height="200" rx="16" fill="url(#bg-grad)" />

  <!-- Olas animadas de fondo -->
  <path class="wave1" d="M-50 140 Q 200 100 450 140 T 950 140 L 950 220 L -50 220 Z" fill="#ffffff" fill-opacity="0.08" />
  <path class="wave2" d="M-50 155 Q 250 190 500 155 T 950 155 L 950 220 L -50 220 Z" fill="#ffffff" fill-opacity="0.12" />

  <!-- Textos centrados -->
  <text x="50%" y="44%" dominant-baseline="middle" text-anchor="middle" class="title">BECKHAM TORRES</text>
  <text x="50%" y="66%" dominant-baseline="middle" text-anchor="middle" class="subtitle">Full-Stack & Mobile Software Developer</text>
</svg>
